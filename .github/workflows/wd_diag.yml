name: Workday diagnostic
on: workflow_dispatch
jobs:
  cffi:
    strategy: {matrix: {n: [1, 2, 3]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.txt curl_cffi && python wd_diag.py cffi
  system:
    strategy: {matrix: {n: [1, 2, 3]}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q --break-system-packages requests; python3 wd_diag.py plain
