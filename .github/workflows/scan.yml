name: Workday job scan

on:
  schedule:
    - cron: "0 * * * *"     # every hour (UTC)
  workflow_dispatch:         # lets you click "Run workflow" manually

permissions:
  contents: write            # needed to commit jobs.xlsx back to the repo

concurrency:
  group: workday-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Scan Workday
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
        run: python workday_jobs.py

      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Job scan $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase -X ours || true
          git push
